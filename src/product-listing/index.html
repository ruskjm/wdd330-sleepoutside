<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleep Outside | Product Listing</title>
    <link rel="stylesheet" href="/css/style.css" />
    <script src="../js/product-listing.js" type="module"></script>
    <script type="module" src="../js/searchAllProduct.js"></script>
  </head>
  <body>
    <header class="divider" id="headerElement"></header>
    <main class="divider">
      <section class="products">
        <h2>Top Products: <span class="products-title"></span></h2>
        
        
        <ul class="product-list"></ul>
      </section>
      <section class="search-all">
        <div class="search-container">
          <h2>All Our Products <span class="all-products"></span></h2>
          <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Search products..." />
            <button id="searchButton">Search</button>
          </div>
        </div>
        <div class="search-results">
          <ul class="product-list" id="product-listing"></ul>
        </div>
      </section>
    </main>
    <footer id="footerElement"></footer>
  </body>
</html>
